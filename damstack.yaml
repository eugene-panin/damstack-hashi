apiVersion: damstack/v1
name: hashistack
description: Consul, Vault and Nomad on one server, over WireGuard, with Traefik, backups and apps such as mail
requires:
  damstack: ">=0.1.0"
  toolbox: ">=1.0.0, <2.0.0"
  host: [docker, ssh-key, wireguard]

questions:
  - name: name
    prompt: A short name for this setup, in lowercase, such as my-cloud
    pattern: "^[a-z][a-z0-9-]{1,40}$"
  - name: server_address
    prompt: The public IP address of your server, from your provider's panel
    pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$"
  - name: bootstrap_user
    prompt: The user you log in to the server with today
    default: root
  - name: ops_user
    prompt: The user you will log in to the server with from now on
    default: ops
    pattern: "^[a-z_][a-z0-9_-]{0,31}$"
  - name: public_interface
    prompt: The server's network interface to the internet (ip -brief address on the server shows it)
    default: eth0
  - name: infra_domain
    prompt: A whole domain on Cloudflare for the admin pages, such as example-admin.com
    pattern: "^[a-z0-9-]+(\\.[a-z0-9-]+)+$"
  - name: acme_email
    prompt: Your email, for Let's Encrypt to write to about the certificates
    pattern: "^[^@\\s]+@[^@\\s]+$"
  - name: dns_zones
    prompt: The Cloudflare domains OpenTofu may publish records in, the admin domain among them
    type: list
  - name: wireguard_clients
    prompt: The devices that may open the admin pages, such as laptop and phone
    type: list
    default: [laptop]
  - name: cloudflare_api_token
    prompt: A Cloudflare token with Zone DNS Edit and Zone Read on those domains
    secret: true
  - name: cloudflare_traefik_token
    prompt: A Cloudflare token with Zone DNS Edit and Zone Read on the admin domain only, for its certificate
    secret: true
  - name: mail
    prompt: Should the server handle mail for your domains?
    type: bool
    default: false
  - name: mail_hostname
    prompt: The name of the mail server, such as mail.example.com
    when: mail
  - name: mail_domains
    prompt: The domains to receive mail for
    type: list
    when: mail

steps:
  - name: init
    run: [bin/stack, init]
    once: true
  - name: bootstrap
    run: [bin/stack, bootstrap]
    once: true
  - name: provision
    run: [bin/stack, provision]
  - name: plan
    run: [bin/stack, plan]
  - name: apply
    run: [bin/stack, apply]
    confirm: true

commands:
  output: [bin/stack, output]

check: [bin/stack, check]
