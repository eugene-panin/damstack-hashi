apiVersion: damstack/v1
name: hashi
description: Consul, Vault and Nomad on one server, over WireGuard, with Traefik, backups and apps such as mail
requires:
  damstack: ">=0.1.0"
  toolbox: ">=1.0.0, <2.0.0"
  host: [docker, ssh-key, wireguard]

questions:
  - name: server_address
    prompt: The public IP address of your server, from your provider's panel
    pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}$"
  - name: bootstrap_user
    prompt: The user you log in to the server with today
    default: root
    pattern: "^[a-z_][a-z0-9_-]{0,31}$"
  - name: ops_user
    prompt: The user you will log in to the server with from now on
    default: ops
    pattern: "^[a-z_][a-z0-9_-]{0,31}$"
  - name: public_interface
    prompt: The server's network interface to the internet (ip -brief address on the server shows it)
    default: eth0
  - name: infra_domain
    prompt: A whole domain on Cloudflare for the admin pages, such as example-admin.com
    pattern: "^[a-z0-9-]+(\\.[a-z0-9-]+)+$"
  - name: acme_email
    prompt: Your email, for Let's Encrypt to write to about the certificates
    pattern: "^[^@\\s]+@[^@\\s]+$"
  - name: dns_zones
    prompt: The Cloudflare domains OpenTofu may publish records in, the admin domain among them
    type: list
    pattern: "^[a-z0-9-]+(\\.[a-z0-9-]+)+$"
  - name: wireguard_clients
    prompt: The devices that may open the admin pages, such as laptop and phone
    type: list
    default: [laptop]
    pattern: "^[a-z][a-z0-9-]{0,30}$"
  - name: mail
    prompt: Should the server handle mail for your domains?
    type: bool
    default: false
  - name: mail_hostname
    prompt: The name of the mail server, such as mail.example.com
    pattern: "^[a-z0-9-]+(\\.[a-z0-9-]+)+$"
    when: mail
  - name: mail_domains
    prompt: The domains to receive mail for
    type: list
    pattern: "^[a-z0-9-]+(\\.[a-z0-9-]+)+$"
    when: mail

secrets:
  - name: vault_stack_ca_key
    generate: ca
    cert: ca.pem
  - name: vault_consul_gossip_key
    generate: base64
  - name: vault_consul_acl_bootstrap_token
    generate: uuid
  - name: vault_consul_acl_dns_token
    generate: uuid
  - name: vault_consul_acl_agent_token
    generate: uuid
  - name: vault_nomad_gossip_key
    generate: base64
  - name: vault_nomad_acl_bootstrap_token
    generate: uuid
  - name: vault_nomad_consul_token
    generate: uuid
  - name: vault_tofu_state_passphrase
    generate: hex
  - name: vault_backup_password
    generate: password
  - name: vault_backup_vault_token
    generate: uuid
  - name: vault_cloudflare_api_token
    ask: A Cloudflare token with Zone DNS Edit and Zone Read on those domains
  - name: vault_cloudflare_traefik_token
    ask: A Cloudflare token with Zone DNS Edit and Zone Read on the admin domain only, for its certificate

config: template/stack.yaml.tmpl

server:
  address: "{{ .config.server.address }}"
  first_user: "{{ .config.server.bootstrap_user }}"
  ops_user: "{{ .config.server.ops_user }}"
  tunnel: "{{ firstHost .config.network.cidr }}"

steps:
  - name: bootstrap
    ansible: &ansible
      playbook: ansible/playbooks/bootstrap.yml
      inventory: ansible/inventory
      requirements: ansible/requirements.yml
    once: true
  - name: provision
    ansible:
      <<: *ansible
      playbook: ansible/playbooks/provision.yml
    keep:
      file: .damstack/work/vault-init.json
      secrets:
        vault_unseal_keys: keys_base64
        vault_root_token: root_token
  - name: apply
    tofu:
      dir: infra
      action: apply
      policy: &policy {dir: policy, nomad_jobs: true}
    env: &tofu
      TF_VAR_state_passphrase: '{{ secret "vault_tofu_state_passphrase" }}'
      TF_VAR_traefik_cloudflare_token: '{{ secret "vault_cloudflare_traefik_token" }}'
      CLOUDFLARE_API_TOKEN: '{{ secret "vault_cloudflare_api_token" }}'
      CONSUL_HTTP_ADDR: 'https://{{ firstHost .config.network.cidr }}:8501'
      CONSUL_CACERT: /work/ca.pem
      CONSUL_HTTP_TOKEN: '{{ secret "vault_consul_acl_bootstrap_token" }}'
      NOMAD_ADDR: 'https://{{ firstHost .config.network.cidr }}:4646'
      NOMAD_CACERT: /work/ca.pem
      NOMAD_TOKEN: '{{ secret "vault_nomad_acl_bootstrap_token" }}'
      VAULT_ADDR: 'https://{{ firstHost .config.network.cidr }}:8200'
      VAULT_CACERT: /work/ca.pem
      VAULT_TOKEN: '{{ secret "vault_root_token" }}'
    confirm: true

commands:
  plan:
    tofu: {dir: infra, action: plan, policy: *policy}
    env: *tofu
  output:
    tofu: {dir: infra, action: output}
    env: *tofu
  provision:
    ansible:
      <<: *ansible
      playbook: ansible/playbooks/provision.yml

check:
  answers: test/answers.yaml
  steps:
    - name: resolve
      ansible:
        <<: *ansible
        playbook: test/resolve.yml
