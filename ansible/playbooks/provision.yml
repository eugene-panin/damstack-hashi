---
- name: Provision the server
  hosts: stack
  gather_facts: true
  tasks:
    - name: Keep the clock synchronized, which the certificates and tokens below rely on
      ansible.builtin.include_role:
        name: eugene_panin.base.timesync

    - name: Authorize the SSH key of the project
      ansible.builtin.include_tasks: tasks/project-key.yml

    - name: Take the WireGuard keys of the devices
      ansible.builtin.include_role:
        name: eugene_panin.base.wireguard_client

    - name: Configure the WireGuard interface
      ansible.builtin.include_role:
        name: eugene_panin.base.wireguard
      vars:
        wireguard_peers: "{{ wireguard_client_peers }}"

    - name: Deny incoming except SSH, WireGuard and the declared ports
      ansible.builtin.include_role:
        name: eugene_panin.base.firewall

    - name: Unpack the backup to restore from
      ansible.builtin.include_tasks: tasks/restore-unpack.yml
      when: stack_restore | length > 0

    - name: Check whether Consul is installed yet
      ansible.builtin.stat:
        path: /usr/local/bin/consul
      register: _stack_consul_binary
      check_mode: false

    - name: Run the Consul agent
      ansible.builtin.include_role:
        name: eugene_panin.hashistack.consul

    - name: Restore Consul from the backup
      ansible.builtin.command:
        argv: [consul, snapshot, restore, "{{ stack_restore_hooks }}/consul.snap"]
        creates: /etc/damstack/restored-consul
      environment:
        CONSUL_HTTP_ADDR: https://127.0.0.1:8501
        CONSUL_CACERT: /etc/consul.d/tls/ca.pem
        CONSUL_HTTP_TOKEN: "{{ consul_acl_bootstrap_token }}"
      when: stack_restore | length > 0
      no_log: true

    - name: Mark Consul as restored, so that a second run does not restore it again
      ansible.builtin.copy:
        content: "{{ stack_restore | basename }}\n"
        dest: /etc/damstack/restored-consul
        owner: root
        group: root
        mode: "0644"
      when: stack_restore | length > 0

    - name: Ensure the policy the Nomad agent registers with
      community.general.consul_policy:
        name: nomad-agent
        description: Nomad agents registering themselves and their workloads
        rules: |
          agent_prefix "" {
            policy = "read"
          }
          node_prefix "" {
            policy = "write"
          }
          service_prefix "" {
            policy = "write"
          }
        token: "{{ consul_acl_bootstrap_token }}"
        scheme: https
        host: 127.0.0.1
        port: 8501
        ca_path: /etc/consul.d/tls/ca.pem
        state: present
      when: not ansible_check_mode or _stack_consul_binary.stat.exists
      no_log: true

    - name: Ensure the Nomad agent's Consul token
      community.general.consul_token:
        accessor_id: "{{ 'nomad-agent' | to_uuid }}"
        secret_id: "{{ nomad_consul_token }}"
        description: Nomad agent
        policies:
          - name: nomad-agent
        token: "{{ consul_acl_bootstrap_token }}"
        scheme: https
        host: 127.0.0.1
        port: 8501
        ca_path: /etc/consul.d/tls/ca.pem
        state: present
      when: not ansible_check_mode or _stack_consul_binary.stat.exists
      no_log: true

    - name: Resolve Consul names on the host and for the tunnel
      ansible.builtin.include_role:
        name: eugene_panin.hashistack.consul_dns

    - name: Run Vault
      ansible.builtin.include_role:
        name: eugene_panin.hashistack.vault

    - name: Run Docker for the Nomad client
      ansible.builtin.include_role:
        name: eugene_panin.base.docker

    # A registry login for the docker driver, so jobs pull private images. Written
    # before the Nomad agent: nomad_extra_config points its auth.config at this file,
    # so it must exist when the agent (re)starts. The agent config gains the plugin
    # block on this run and the Nomad role restarts the agent itself; a later run that
    # only changes the login does not touch the agent config, so the restart below
    # applies it. Absent registry leaves nomad_extra_config {} and both are skipped.
    - name: Give the Nomad client a container registry login for private images
      when: ((stack.registry | default({})).server | default('')) | length > 0
      block:
        - name: The Nomad configuration directory exists
          ansible.builtin.file:
            path: "{{ nomad_config_dir }}"
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: The registry auth file is in place
          ansible.builtin.copy:
            dest: "{{ nomad_docker_auth_file }}"
            owner: root
            group: root
            mode: '0600'
            content: >-
              {{ {'auths': {stack.registry.server:
                 {'auth': (stack.registry.username | default('') ~ ':' ~ vault_registry_password) | b64encode}}}
                 | to_nice_json }}
          no_log: true
          register: _registry_auth

    - name: Run the Nomad agent
      ansible.builtin.include_role:
        name: eugene_panin.hashistack.nomad

    - name: Apply a changed registry login to the running Nomad agent
      when:
        - _registry_auth is defined
        - _registry_auth is changed
      ansible.builtin.systemd:
        name: nomad
        state: restarted

    - name: Ship host and app metrics and logs to the observability backends
      ansible.builtin.include_role:
        name: eugene_panin.observability.alloy
      vars:
        alloy_mimir_remote_write_url: "http://{{ stack_address }}:9009/api/v1/push"
        alloy_loki_push_url: "http://{{ stack_address }}:3100/loki/api/v1/push"
        alloy_host_metrics: true
        alloy_journal_logs: true
        alloy_extra_config: |
          // App metrics: every Consul service tagged "metrics", scraped on /metrics
          // and remote-written to Mimir. An app joins the set by registering with
          // that tag — no change here.
          discovery.consul "apps" {
            server = "https://127.0.0.1:8501"
            token  = "{{ consul_acl_dns_token }}"
            tls_config {
              insecure_skip_verify = true
            }
          }

          discovery.relabel "apps" {
            targets = discovery.consul.apps.targets

            rule {
              source_labels = ["__meta_consul_tags"]
              regex         = ".*,metrics,.*"
              action        = "keep"
            }

            rule {
              source_labels = ["__meta_consul_service"]
              target_label  = "app"
            }
          }

          prometheus.scrape "apps" {
            targets    = discovery.relabel.apps.output
            forward_to = [prometheus.remote_write.mimir.receiver]
          }

    - name: Read the Vault policy the backup takes snapshots with
      ansible.builtin.uri:
        url: "https://{{ stack_address }}:8200/v1/sys/policies/acl/backup"
        ca_path: /etc/vault.d/tls/ca.pem
        headers:
          X-Vault-Token: "{{ stack_vault_token }}"
        status_code: [200, 404]
      register: _stack_backup_policy
      check_mode: false
      no_log: true

    - name: Ensure the Vault policy allows the snapshot and nothing else
      ansible.builtin.uri:
        url: "https://{{ stack_address }}:8200/v1/sys/policies/acl/backup"
        ca_path: /etc/vault.d/tls/ca.pem
        method: PUT
        headers:
          X-Vault-Token: "{{ stack_vault_token }}"
        body_format: json
        body:
          policy: "{{ _stack_backup_policy_text }}"
        status_code: [204]
      when: _stack_backup_policy.json.data.policy | default('') != _stack_backup_policy_text
      changed_when: true
      no_log: true
      vars:
        _stack_backup_policy_text: |
          path "sys/storage/raft/snapshot" {
            capabilities = ["read"]
          }

    - name: Look up the Vault token of the backup
      ansible.builtin.uri:
        url: "https://{{ stack_address }}:8200/v1/auth/token/lookup"
        ca_path: /etc/vault.d/tls/ca.pem
        method: POST
        headers:
          X-Vault-Token: "{{ stack_vault_token }}"
        body_format: json
        body:
          token: "{{ vault_backup_vault_token }}"
        status_code: [200, 400, 403]
      register: _stack_backup_token
      check_mode: false
      no_log: true

    - name: Create the Vault token of the backup, renewed by every run
      ansible.builtin.uri:
        url: "https://{{ stack_address }}:8200/v1/auth/token/create-orphan"
        ca_path: /etc/vault.d/tls/ca.pem
        method: POST
        headers:
          X-Vault-Token: "{{ stack_vault_token }}"
        body_format: json
        body:
          id: "{{ vault_backup_vault_token }}"
          policies: [backup]
          period: 768h
          display_name: backup
        status_code: [200]
      when: _stack_backup_token.status != 200
      changed_when: true
      no_log: true

    - name: Install the hook that copies the host volumes, stopping the jobs that ask for it
      ansible.builtin.copy:
        src: backup-volumes
        dest: /usr/local/sbin/damstack-backup-volumes
        owner: root
        group: root
        mode: "0755"

    - name: Back up the copies of the host volumes and the snapshots of Consul, Nomad and Vault
      ansible.builtin.include_role:
        name: eugene_panin.base.backup
